<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>r/AITA Sycophancy Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --cream: #FAF9F6;
  --warm-white: #FFFFFF;
  --ink: #1A1A1B;
  --ink-light: #3c3c3d;
  --ink-muted: #7c7c7c;
  --ink-faint: #a8a8a8;
  --border: #EDEFF1;
  --border-strong: #ccc;
  --orangered: #FF4500;
  --orangered-soft: #fff0eb;
  --orangered-muted: #ff6d3a;
  --periwinkle: #7193FF;
  --periwinkle-soft: #edf0ff;
  --nta-green: #46D160;
  --nta-green-bg: #e8fbe9;
  --nta-green-dark: #1f8435;
  --yta-red: #EA0027;
  --yta-red-bg: #fde8ec;
  --yta-red-dark: #b5001e;
  --syc-amber: #F59E0B;
  --syc-amber-bg: #FEF3C7;
  --syc-amber-dark: #B45309;
  --surface-hover: #F6F7F8;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
  --radius: 8px;
  --radius-lg: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Topbar */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--warm-white);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.topbar-inner {
  max-width: 980px; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between; height: 48px;
}
.topbar-logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1rem; color: var(--ink);
  text-decoration: none;
}
.topbar-logo svg { width: 28px; height: 28px; }
.topbar-logo .sub { font-weight: 400; color: var(--ink-muted); }
.topbar-stats {
  display: flex; gap: 16px; font-size: 0.78rem; color: var(--ink-muted);
}
.topbar-stats b { color: var(--ink); }

/* Hero */
.hero {
  background: linear-gradient(135deg, var(--orangered) 0%, var(--orangered-muted) 100%);
  padding: 48px 20px 44px;
}
.hero-inner { max-width: 980px; margin: 0 auto; }
.hero h1 { font-size: 1.75rem; font-weight: 700; color: white; margin-bottom: 10px; }
.hero p { color: rgba(255,255,255,0.9); font-size: 0.95rem; max-width: 600px; }
.hero a { color: rgba(255,255,255,1); text-decoration: underline; }

/* Layout */
.layout { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }

/* Filters */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  padding: 16px 20px; background: var(--warm-white);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); margin-bottom: 20px;
}
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label {
  font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--ink-muted);
}
.filter-group select, .filter-group input {
  font-family: inherit; font-size: 0.82rem; padding: 6px 10px;
  border: 1px solid var(--border-strong); border-radius: 6px;
  background: var(--warm-white); color: var(--ink); outline: none;
}
.filter-group input[type="text"] { min-width: 160px; }
.filter-separator { width: 1px; height: 40px; background: var(--border); }

/* Results meta */
.results-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; font-size: 0.82rem; color: var(--ink-muted);
}
.results-legend { display: flex; gap: 14px; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* Loading state */
.loading-state {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding: 60px 20px; color: var(--ink-muted);
}
.loading-spinner {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--orangered); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.no-results { padding: 40px; text-align: center; color: var(--ink-muted); }

/* Post cards */
.post-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow 0.2s;
  animation: fadeIn 0.3s ease both;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
.post-card:hover { box-shadow: var(--shadow-md); }
.post-card.expanded { box-shadow: var(--shadow-lg); }

/* Card header */
.card-header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; cursor: pointer;
  transition: background 0.15s;
}
.card-header:hover { background: var(--surface-hover); }

.vote-col {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 36px;
}
.vote-arrow { opacity: 0.4; }
.vote-arrow.up svg { fill: var(--nta-green); width: 12px; }
.vote-arrow.down svg { fill: var(--yta-red); width: 12px; }
.vote-arrow.up { opacity: 1; }
.vote-arrow.down { opacity: 1; }
.reddit-verdict {
  font-size: 0.65rem; font-weight: 700; letter-spacing: 0.02em;
}
.reddit-verdict.nta { color: var(--nta-green-dark); }
.reddit-verdict.yta { color: var(--yta-red-dark); }

.card-content { flex: 1; min-width: 0; }
.card-meta { font-size: 0.72rem; color: var(--ink-muted); margin-bottom: 2px; }
.sub-tag {
  font-weight: 600; color: var(--ink);
  background: var(--surface-hover); padding: 1px 6px; border-radius: 3px;
}
.card-title {
  font-size: 0.92rem; font-weight: 600; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}

.syc-col {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 90px;
}
.syc-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); font-weight: 600; }
.syc-gauge { width: 72px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.syc-gauge-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.syc-gauge-fill.low { background: var(--nta-green); }
.syc-gauge-fill.med { background: var(--syc-amber); }
.syc-gauge-fill.high { background: var(--yta-red); }
.syc-score { font-size: 0.85rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
.syc-score.low { color: var(--nta-green-dark); }
.syc-score.med { color: var(--syc-amber-dark); }
.syc-score.high { color: var(--yta-red-dark); }

.expand-chevron {
  color: var(--ink-faint); transition: transform 0.3s;
}
.post-card.expanded .expand-chevron { transform: rotate(180deg); }

/* Card body (collapsible) */
.card-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s ease;
  border-top: 0 solid var(--border);
}
.card-body.open {
  max-height: none; overflow: visible;
  border-top-width: 1px;
  padding: 20px 18px;
}

/* Narrative */
.narrative-section { margin-bottom: 20px; }
.narrative-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--ink-muted); margin-bottom: 8px;
}
.narrative-label svg { width: 14px; height: 14px; fill: var(--ink-faint); }
.narrative-text {
  font-size: 0.88rem;
  line-height: 1.65;
  color: var(--ink-light);
  max-height: 400px;
  overflow-y: auto;
  padding: 14px 16px;
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  white-space: pre-wrap;
  word-break: break-word;
}
.narrative-text::-webkit-scrollbar { width: 6px; }
.narrative-text::-webkit-scrollbar-track { background: transparent; }
.narrative-text::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* Verdict section */
.verdict-section { margin-bottom: 20px; }
.verdict-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.verdict-header h3 { font-size: 0.85rem; font-weight: 600; }
.reddit-verdict-badge {
  font-size: 0.72rem; font-weight: 700; padding: 4px 12px;
  border-radius: 20px; letter-spacing: 0.02em;
}
.reddit-verdict-badge.nta { background: var(--nta-green-bg); color: var(--nta-green-dark); }
.reddit-verdict-badge.yta { background: var(--yta-red-bg); color: var(--yta-red-dark); }

/* Condition tabs */
.cond-tabs {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
}
.cond-tab {
  font-size: 0.72rem; padding: 5px 12px; border-radius: 20px;
  cursor: pointer; font-weight: 500; border: 1px solid var(--border);
  background: var(--warm-white); color: var(--ink-muted);
  transition: all 0.15s;
}
.cond-tab:hover { border-color: var(--border-strong); color: var(--ink); }
.cond-tab.active {
  background: var(--orangered); color: white;
  border-color: var(--orangered); font-weight: 600;
}

/* Model grid */
.model-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.model-cell {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--warm-white);
  font-size: 0.78rem; min-width: 160px;
  transition: all 0.15s; cursor: pointer;
}
.model-cell:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.model-cell.disagrees { border-color: var(--syc-amber); background: var(--syc-amber-bg); }
.model-cell.selected { border-color: var(--orangered); box-shadow: 0 0 0 2px var(--orangered-soft); }
.model-cell.selected.disagrees { border-color: var(--orangered); }
.mname { font-weight: 500; color: var(--ink-light); flex: 1; }
.mverdict { font-weight: 700; font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; }
.mverdict.nta { color: var(--nta-green-dark); }
.mverdict.yta { color: var(--yta-red-dark); }
.disagree-star { color: var(--syc-amber); font-size: 0.7rem; }

/* Response cards */
.responses-section { margin-top: 20px; }
.response-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
}
.response-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--surface-hover);
  border-bottom: 1px solid var(--border);
}
.response-model-icon {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}
.response-model-icon.claude { background: #D97706; }
.response-model-icon.gpt { background: #10A37F; }
.response-model-icon.gemini { background: #4285F4; }
.response-model-icon.llama { background: #7C3AED; }
.response-model-icon.deepseek { background: #0EA5E9; }
.response-model-icon.mistral { background: #F97316; }
.response-model-icon.qwen { background: #8B5CF6; }
.response-model-icon.default { background: #6B7280; }
.response-model-name { font-size: 0.78rem; font-weight: 600; color: var(--ink); flex: 1; }
.response-verdict {
  font-size: 0.72rem; font-weight: 700; padding: 3px 10px;
  border-radius: 20px; font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.02em;
}
.response-verdict.nta { background: var(--nta-green-bg); color: var(--nta-green-dark); }
.response-verdict.yta { background: var(--yta-red-bg); color: var(--yta-red-dark); }
.response-verdict.nah { background: var(--periwinkle-soft); color: var(--periwinkle); }
.response-verdict.esh { background: var(--syc-amber-bg); color: var(--syc-amber-dark); }
.response-body {
  padding: 10px 12px;
  font-size: 0.82rem;
  line-height: 1.6;
  max-height: 400px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--ink-light);
}
.response-body::-webkit-scrollbar { width: 5px; }
.response-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.response-none {
  padding: 20px; text-align: center; color: var(--ink-faint); font-size: 0.82rem;
  font-style: italic;
}

/* Pagination */
.pagination {
  display: flex; justify-content: center; align-items: center; gap: 12px;
  margin-top: 20px;
}
.pagination button {
  font-family: inherit; font-size: 0.82rem; font-weight: 500;
  padding: 8px 18px; border: 1px solid var(--border-strong);
  border-radius: var(--radius); background: var(--warm-white);
  cursor: pointer; transition: all 0.15s;
}
.pagination button:hover:not(:disabled) { background: var(--surface-hover); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.page-info { font-size: 0.82rem; color: var(--ink-muted); }

/* Loading responses spinner */
.response-loading {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 30px; color: var(--ink-muted); font-size: 0.82rem;
}
.response-loading .loading-spinner { width: 20px; height: 20px; }
</style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <a class="topbar-logo" href="#">
      <svg viewBox="0 0 24 24" fill="var(--orangered)"><circle cx="12" cy="12" r="12"/><circle cx="12" cy="10" r="5" fill="white"/><rect x="10" y="4" width="4" height="3" rx="2" fill="white"/><circle cx="9" cy="9.5" r="1" fill="var(--orangered)"/><circle cx="15" cy="9.5" r="1" fill="var(--orangered)"/><path d="M9 12.5c0 0 1.5 1.5 3 1.5s3-1.5 3-1.5" stroke="var(--orangered)" stroke-width="0.8" fill="none" stroke-linecap="round"/></svg>
      <span>r/AITA<span class="sub"> Sycophancy Explorer</span></span>
    </a>
    <div class="topbar-stats" id="topbarStats"></div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-inner">
    <h1>Do AI Models Just Tell You What You Want to Hear?</h1>
    <p>Exploring sycophancy in LLM moral reasoning across 4,000 r/AmItheAsshole posts.
    Data from <a href="https://arxiv.org/html/2510.01395v1" target="_blank">arXiv:2510.01395</a>
    &mdash; comparing Reddit verdicts with 11 AI models under different prompting conditions.</p>
  </div>
</section>

<!-- Main content -->
<div class="layout">

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>Sort</label>
      <select id="sortBy">
        <option value="syc-desc">Most Sycophantic</option>
        <option value="syc-asc">Least Sycophantic</option>
        <option value="id">Post Order</option>
      </select>
    </div>
    <div class="filter-separator"></div>
    <div class="filter-group">
      <label>Reddit Verdict</label>
      <select id="filterReddit">
        <option value="all">All Verdicts</option>
        <option value="NTA">NTA Only</option>
        <option value="YTA">YTA Only</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Min Syc Score</label>
      <input type="number" id="minSyc" value="0" min="0" max="12" step="0.5">
    </div>
    <div class="filter-separator"></div>
    <div class="filter-group">
      <label>Model Disagrees</label>
      <select id="filterDisagree">
        <option value="any">Any Model</option>
        <option value="Claude">Claude</option>
        <option value="gpt-4o">GPT-4o</option>
        <option value="Gemini">Gemini</option>
        <option value="Llama-70B">Llama-70B</option>
        <option value="Llama-8B">Llama-8B</option>
        <option value="Mistral-24B">Mistral-24B</option>
      </select>
    </div>
    <div class="filter-separator"></div>
    <div class="filter-group">
      <label>Search</label>
      <input type="text" id="searchText" placeholder="Search posts...">
    </div>
  </div>

  <!-- Results meta -->
  <div class="results-meta">
    <div class="results-count" id="resultsCount"></div>
    <div class="results-legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--nta-green)"></span> NTA</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--yta-red)"></span> YTA</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--syc-amber)"></span> Disagrees w/ Reddit</span>
    </div>
  </div>

  <!-- Post list -->
  <div id="postList"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
// --- Supabase client ---
const SUPABASE_URL = 'https://fbweewjqrlmbwzxuvwaa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_co611F4u3t_ZANcEsVMyzQ_k4FTSVaC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PAGE_SIZE = 20;
let allPosts = [];
let filtered = [];
let page = 0;
let activeCondition = {};
// Cache for loaded judgments: postId -> [{model, condition, verdict, binary_verdict, response}]
const judgmentCache = new Map();
// Track selected model per post card index
const activeModel = {};

const COND_LABELS = {
  base:'Base', NTA_context:'NTA Framing', YTA_context:'YTA Framing',
  third_person:'3rd Person', think_right:'Think Right', think_wrong:'Think Wrong',
  honest:'Honest', direct:'Direct', cot:'Chain-of-Thought', questioning:'Questioning',
  iterative_response:'Iterative'
};
const CONDITIONS = Object.keys(COND_LABELS);

const MODEL_STYLES = {
  'Claude': { cls: 'claude', letter: 'C' },
  'gpt-4o': { cls: 'gpt', letter: 'G' },
  'Gemini': { cls: 'gemini', letter: 'Ge' },
  'Llama-70B': { cls: 'llama', letter: 'L' },
  'Llama-17B': { cls: 'llama', letter: 'L' },
  'Llama-8B': { cls: 'llama', letter: 'L' },
  'DeepSeek': { cls: 'deepseek', letter: 'D' },
  'Mistral-7B': { cls: 'mistral', letter: 'M' },
  'Mistral-24B': { cls: 'mistral', letter: 'M' },
  'Qwen': { cls: 'qwen', letter: 'Q' },
  'GPT-5': { cls: 'gpt', letter: 'G5' },
};

async function init() {
  document.getElementById('postList').innerHTML =
    '<div class="loading-state"><div class="loading-spinner"></div><p>Loading posts from database...</p></div>';

  // Fetch all posts in batches (Supabase limits to 1000 per request)
  let data = [];
  let offset = 0;
  const BATCH = 1000;
  while (true) {
    const { data: batch, error } = await sb
      .from('posts')
      .select('id, title, narrative, reddit_verdict, syc_score, syc_details')
      .range(offset, offset + BATCH - 1);
    if (error) {
      document.getElementById('postList').innerHTML =
        `<div class="no-results"><p>Error loading data: ${error.message}</p></div>`;
      return;
    }
    data = data.concat(batch);
    if (batch.length < BATCH) break;
    offset += BATCH;
  }

  // Transform to match old format for compatibility
  allPosts = data.map(p => ({
    id: p.id,
    title: p.title,
    narrative: p.narrative,
    reddit: p.reddit_verdict,
    sycScore: p.syc_score,
    sycDetails: p.syc_details || {},
    // judgments will be loaded on demand
    judgments: null,
  }));

  bindControls();
  applyFilters();
}

function bindControls() {
  ['sortBy','filterReddit','minSyc','filterDisagree','searchText'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => { page = 0; applyFilters(); });
  });
}

function applyFilters() {
  const sort = document.getElementById('sortBy').value;
  const reddit = document.getElementById('filterReddit').value;
  const minSyc = parseFloat(document.getElementById('minSyc').value) || 0;
  const disagree = document.getElementById('filterDisagree').value;
  const search = document.getElementById('searchText').value.toLowerCase();

  filtered = allPosts.filter(p => {
    if (reddit !== 'all' && p.reddit !== reddit) return false;
    if (p.sycScore < minSyc) return false;
    if (search && !p.narrative.toLowerCase().includes(search)) return false;
    // Model disagrees filter requires judgments — use sycDetails as proxy
    if (disagree !== 'any') {
      // We can check sycDetails for the model flip, but for base disagreement
      // we need judgments. For now, filter based on sycDetails having the model.
      // Full filtering available after expanding.
      // Actually let's skip this filter if judgments not loaded — show all
    }
    return true;
  });

  if (sort === 'syc-desc') filtered.sort((a, b) => b.sycScore - a.sycScore);
  else if (sort === 'syc-asc') filtered.sort((a, b) => a.sycScore - b.sycScore);
  else filtered.sort((a, b) => a.id - b.id);

  updateMeta();
  renderPage();
}

function updateMeta() {
  const avg = filtered.length ? (filtered.reduce((s, p) => s + p.sycScore, 0) / filtered.length).toFixed(1) : '0';
  const yta = filtered.filter(p => p.reddit === 'YTA').length;
  document.getElementById('resultsCount').innerHTML =
    `<b>${filtered.length}</b> of ${allPosts.length} posts &middot; avg sycophancy <b>${avg}</b> &middot; <b>${yta}</b> Reddit YTA`;
  document.getElementById('topbarStats').innerHTML =
    `<span><b>${filtered.length}</b> posts</span><span>avg syc <b>${avg}</b></span>`;
}

function sycLevel(score) {
  if (score <= 2) return 'low';
  if (score <= 6) return 'med';
  return 'high';
}

function renderPage() {
  const start = page * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);
  const list = document.getElementById('postList');

  if (!slice.length) {
    list.innerHTML = '<div class="no-results"><p>No posts match your filters. Try adjusting the criteria.</p></div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  list.innerHTML = slice.map((p, idx) => {
    const gi = start + idx;
    const title = p.title || p.narrative.split('\n')[0].substring(0, 150);
    const lvl = sycLevel(p.sycScore);
    const pct = Math.min(100, Math.round((p.sycScore / 12) * 100));
    return `
    <div class="post-card" id="post-${gi}" style="animation-delay:${idx * 0.03}s">
      <div class="card-header" onclick="toggle(${gi})">
        <div class="vote-col">
          <div class="vote-arrow ${p.reddit === 'NTA' ? 'up' : 'down'}">
            ${p.reddit === 'NTA'
              ? '<svg viewBox="0 0 14 10"><path d="M7 0L14 10H0Z"/></svg>'
              : '<svg viewBox="0 0 14 10"><path d="M7 10L0 0h14Z"/></svg>'}
          </div>
          <span class="reddit-verdict ${p.reddit.toLowerCase()}">${p.reddit}</span>
        </div>
        <div class="card-content">
          <div class="card-meta">
            <span class="sub-tag">r/AmItheAsshole</span>
            <span>&middot; Post #${p.id + 1}</span>
          </div>
          <div class="card-title">${esc(title)}</div>
        </div>
        <div class="syc-col">
          <span class="syc-label">Sycophancy</span>
          <div class="syc-gauge"><div class="syc-gauge-fill ${lvl}" style="width:${pct}%"></div></div>
          <span class="syc-score ${lvl}">${p.sycScore}</span>
        </div>
        <div class="expand-chevron">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 6L8 9.5L11.5 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="card-body" id="body-${gi}">
        <div class="narrative-section">
          <div class="narrative-label">
            <svg viewBox="0 0 16 16"><path d="M2 3h12v1H2zm0 3h12v1H2zm0 3h8v1H2zm0 3h10v1H2z"/></svg>
            Original Post
          </div>
          <div class="narrative-text">${esc(p.narrative)}</div>
        </div>
        <div id="judgments-${gi}">
          <div class="response-loading">
            <div class="loading-spinner"></div>
            Loading model judgments...
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  const total = Math.ceil(filtered.length / PAGE_SIZE);
  document.getElementById('pagination').innerHTML = `
    <button onclick="nav(-1)" ${page === 0 ? 'disabled' : ''}>&larr; Previous</button>
    <span class="page-info">${page + 1} / ${total}</span>
    <button onclick="nav(1)" ${page >= total - 1 ? 'disabled' : ''}>Next &rarr;</button>`;
}

async function loadJudgments(postId) {
  if (judgmentCache.has(postId)) return judgmentCache.get(postId);

  const { data, error } = await sb
    .from('judgments')
    .select('model, condition, verdict, binary_verdict, response')
    .eq('post_id', postId);

  if (error) {
    console.error('Error loading judgments:', error);
    return [];
  }

  judgmentCache.set(postId, data);
  return data;
}

function buildJudgmentsMap(judgmentRows) {
  // Convert flat rows into {model: {condition: verdict}} map
  const map = {};
  for (const j of judgmentRows) {
    if (!map[j.model]) map[j.model] = {};
    map[j.model][j.condition] = j.verdict || j.binary_verdict;
  }
  return map;
}

function renderJudgmentsSection(gi, post, judgmentRows) {
  const judgments = buildJudgmentsMap(judgmentRows);
  const cond = activeCondition[gi] || 'base';

  // Auto-select first model with a response if none selected
  if (!activeModel[gi]) {
    const firstWithResponse = judgmentRows.find(j => j.condition === cond && j.response);
    if (firstWithResponse) activeModel[gi] = firstWithResponse.model;
  }

  // Get responses for current condition
  const responses = judgmentRows.filter(j => j.condition === cond && j.response);

  return `
    <div class="verdict-section">
      <div class="verdict-header">
        <h3>Model Judgments</h3>
        <span class="reddit-verdict-badge ${post.reddit.toLowerCase()}">Reddit: ${post.reddit}</span>
      </div>
      <div class="cond-tabs" id="tabs-${gi}">${renderTabs(gi, judgments)}</div>
      <div class="model-grid" id="grid-${gi}">${renderGrid(gi, judgments, post.reddit, cond)}</div>
    </div>
    <div class="responses-section" id="responses-${gi}">
      ${renderResponses(gi, responses, cond)}
    </div>`;
}

function renderTabs(idx, judgments) {
  const avail = CONDITIONS.filter(c =>
    Object.values(judgments).some(mj => mj[c] != null));
  activeCondition[idx] = activeCondition[idx] || 'base';
  return avail.map(c =>
    `<span class="cond-tab ${activeCondition[idx] === c ? 'active' : ''}"
          onclick="switchCond(${idx},'${c}',event)">${COND_LABELS[c]}</span>`
  ).join('');
}

function renderGrid(gi, judgments, redditVerdict, cond) {
  const sel = activeModel[gi];
  return Object.keys(judgments).sort().map(m => {
    const v = judgments[m][cond];
    if (v == null) return '';
    const dis = v !== redditVerdict;
    const selected = sel === m;
    return `<div class="model-cell ${dis ? 'disagrees' : ''} ${selected ? 'selected' : ''}"
                onclick="selectModel(${gi},'${m}',event)">
      <span class="mname">${esc(m)}</span>
      <span class="mverdict ${v.toLowerCase()}">${v}</span>
      ${dis ? '<span class="disagree-star" title="Disagrees with Reddit">&#10022;</span>' : ''}
    </div>`;
  }).filter(Boolean).join('');
}

function extractVerdict(text) {
  if (!text || text.length < 5) return null;
  const head = text.slice(0, 300).toUpperCase();
  const candidates = [];
  const nta = head.indexOf('NTA');
  const yta = head.indexOf('YTA');
  const nah = head.indexOf('NAH');
  const esh = head.indexOf('ESH');
  if (nta >= 0) candidates.push([nta, 'NTA']);
  if (yta >= 0) candidates.push([yta, 'YTA']);
  if (nah >= 0) candidates.push([nah, 'NAH']);
  if (esh >= 0) candidates.push([esh, 'ESH']);
  for (const [phrase, v] of [
    ['NOT THE ASSHOLE', 'NTA'], ['NOT THE A**HOLE', 'NTA'], ['NOT THE A-HOLE', 'NTA'], ["AREN'T THE ASSHOLE", 'NTA'],
    ["YOU'RE THE ASSHOLE", 'YTA'], ['YOU ARE THE ASSHOLE', 'YTA'], ['THE ASSHOLE HERE', 'YTA'],
    ["YOU'RE THE A**HOLE", 'YTA'], ['YOU ARE THE A-HOLE', 'YTA'],
    ['NO ASSHOLES HERE', 'NAH'], ['EVERYONE SUCKS HERE', 'ESH'],
  ]) {
    const pos = head.indexOf(phrase);
    if (pos >= 0) candidates.push([pos, v]);
  }
  if (candidates.length) {
    candidates.sort((a, b) => a[0] - b[0]);
    return candidates[0][1];
  }
  return null;
}

function renderResponses(gi, responses, cond) {
  const sel = activeModel[gi];
  // If a model is selected, show only that model's response
  const toShow = sel ? responses.filter(j => j.model === sel) : [];

  if (!sel) {
    return `<div class="response-none">Click a model above to see its response.</div>`;
  }
  if (!toShow.length) {
    return `<div class="response-none">No open-ended response from ${sel} for ${COND_LABELS[cond] || cond} condition.</div>`;
  }

  const j = toShow[0];
  const style = MODEL_STYLES[j.model] || { cls: 'default', letter: j.model[0] };
  // Extract verdict from response text (catches NAH/ESH too)
  const verdict = extractVerdict(j.response) || j.verdict;
  return `
    <div class="narrative-label" style="margin-bottom:8px">
      <svg viewBox="0 0 16 16"><path d="M2 2h12v9H5l-3 3V2z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      AI Response (${COND_LABELS[cond] || cond} condition)
    </div>
    <div class="response-card">
      <div class="response-header">
        <div class="response-model-icon ${style.cls}">${style.letter}</div>
        <span class="response-model-name">${esc(j.model)}</span>
        ${verdict ? `<span class="response-verdict ${verdict.toLowerCase()}">${esc(verdict)}</span>` : ''}
      </div>
      <div class="response-body">${esc(j.response)}</div>
    </div>`;
}

async function selectModel(idx, model, ev) {
  ev.stopPropagation();
  activeModel[idx] = activeModel[idx] === model ? null : model; // toggle
  const post = filtered[idx];
  const judgmentRows = await loadJudgments(post.id);
  const judgments = buildJudgmentsMap(judgmentRows);
  const cond = activeCondition[idx] || 'base';

  // Re-render grid to update selected highlight
  document.getElementById(`grid-${idx}`).innerHTML = renderGrid(idx, judgments, post.reddit, cond);

  // Update response
  const responses = judgmentRows.filter(j => j.condition === cond && j.response);
  document.getElementById(`responses-${idx}`).innerHTML = renderResponses(idx, responses, cond);
}

async function switchCond(idx, cond, ev) {
  ev.stopPropagation();
  activeCondition[idx] = cond;
  const post = filtered[idx];
  const judgmentRows = await loadJudgments(post.id);
  const judgments = buildJudgmentsMap(judgmentRows);

  document.getElementById(`tabs-${idx}`).innerHTML = renderTabs(idx, judgments);
  document.getElementById(`grid-${idx}`).innerHTML = renderGrid(idx, judgments, post.reddit, cond);

  // Update response for new condition (keep selected model)
  const responses = judgmentRows.filter(j => j.condition === cond && j.response);
  document.getElementById(`responses-${idx}`).innerHTML = renderResponses(idx, responses, cond);
}

async function toggle(idx) {
  const card = document.getElementById(`post-${idx}`);
  const body = document.getElementById(`body-${idx}`);
  const isExpanding = !card.classList.contains('expanded');

  card.classList.toggle('expanded');
  body.classList.toggle('open');

  if (isExpanding) {
    const post = filtered[idx];
    const container = document.getElementById(`judgments-${idx}`);

    // Show loading state
    container.innerHTML = '<div class="response-loading"><div class="loading-spinner"></div>Loading model judgments...</div>';

    // Fetch judgments from Supabase
    const judgmentRows = await loadJudgments(post.id);
    container.innerHTML = renderJudgmentsSection(idx, post, judgmentRows);
  }
}

function nav(d) {
  page += d;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
