<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AITA Sycophancy Explorer</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 0;
    margin-bottom: 16px;
  }
  header h1 { font-size: 1.6rem; margin-bottom: 4px; }
  header p { color: var(--text-muted); font-size: 0.9rem; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 12px;
    padding: 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 16px; align-items: center;
  }
  .controls label { color: var(--text-muted); font-size: 0.85rem; }
  .controls select, .controls input {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 0.85rem;
  }
  .controls select:focus, .controls input:focus { outline: none; border-color: var(--accent); }
  .control-group { display: flex; flex-direction: column; gap: 4px; }

  .stats {
    display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    font-size: 0.85rem; color: var(--text-muted);
  }
  .stats span { background: var(--surface); padding: 4px 10px; border-radius: 4px; }
  .stats .num { color: var(--accent); font-weight: 600; }

  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .post-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    gap: 12px;
  }
  .post-header:hover { background: var(--surface2); }
  .post-header .left { flex: 1; min-width: 0; }
  .post-header .title {
    font-size: 0.95rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .post-header .badges { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

  .badge {
    font-size: 0.75rem; font-weight: 600;
    padding: 2px 8px; border-radius: 12px;
    white-space: nowrap;
  }
  .badge-nta { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-yta { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-syc {
    background: rgba(210,153,34,0.15); color: var(--orange);
    font-size: 0.7rem;
  }

  .post-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }
  .post-body.open { display: block; }

  .narrative {
    background: var(--surface2);
    padding: 12px; border-radius: 6px;
    margin: 12px 0;
    font-size: 0.9rem;
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
  }

  .section-label {
    font-size: 0.8rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin: 16px 0 8px;
    font-weight: 600;
  }

  .judgment-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 6px;
  }
  .judgment-cell {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px;
    background: var(--surface2);
    border-radius: 4px;
    font-size: 0.8rem;
  }
  .judgment-cell .model-name { color: var(--text-muted); }
  .judgment-cell .verdict-nta { color: var(--green); font-weight: 600; }
  .judgment-cell .verdict-yta { color: var(--red); font-weight: 600; }
  .judgment-cell.flipped { border-left: 3px solid var(--orange); }
  .judgment-cell.agrees-reddit { opacity: 0.7; }

  .condition-tabs {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .condition-tab {
    background: var(--surface2); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 0.75rem;
    cursor: pointer;
  }
  .condition-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .syc-detail {
    font-size: 0.8rem; color: var(--orange); margin-top: 8px;
    padding: 8px; background: rgba(210,153,34,0.08); border-radius: 4px;
  }
  .syc-detail div { margin-bottom: 2px; }

  .response-block {
    margin-top: 12px;
    padding: 10px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 0.85rem;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
  }
  .response-block .model-tag {
    color: var(--purple); font-weight: 600; font-size: 0.8rem;
    margin-bottom: 4px;
  }

  .pagination {
    display: flex; justify-content: center; align-items: center;
    gap: 8px; padding: 16px 0;
  }
  .pagination button {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 0.85rem;
  }
  .pagination button:disabled { opacity: 0.3; cursor: default; }
  .pagination button:not(:disabled):hover { border-color: var(--accent); }
  .pagination span { color: var(--text-muted); font-size: 0.85rem; }

  .loading {
    text-align: center; padding: 60px; color: var(--text-muted);
  }
  .loading .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 0.75rem; color: var(--text-muted);
    margin-bottom: 12px;
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AITA Sycophancy Explorer</h1>
    <p>Exploring AI sycophancy in moral judgment: Reddit verdicts vs. LLM responses across prompting conditions.<br>
    Data from <a href="https://arxiv.org/html/2510.01395v1" target="_blank">Sycophancy in LLM Moral Reasoning (arXiv:2510.01395)</a></p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label>Sort by</label>
      <select id="sortBy">
        <option value="syc-desc">Most sycophantic</option>
        <option value="syc-asc">Least sycophantic</option>
        <option value="id">Original order</option>
      </select>
    </div>
    <div class="control-group">
      <label>Reddit verdict</label>
      <select id="filterReddit">
        <option value="all">All</option>
        <option value="NTA">NTA only</option>
        <option value="YTA">YTA only</option>
      </select>
    </div>
    <div class="control-group">
      <label>Min sycophancy score</label>
      <input type="number" id="minSyc" value="0" min="0" max="12" step="0.5" style="width:70px">
    </div>
    <div class="control-group">
      <label>Model disagrees with Reddit</label>
      <select id="filterDisagree">
        <option value="any">Any</option>
        <option value="Claude">Claude</option>
        <option value="gpt-4o">GPT-4o</option>
        <option value="Gemini">Gemini</option>
        <option value="Llama-70B">Llama-70B</option>
        <option value="Llama-8B">Llama-8B</option>
        <option value="Mistral-24B">Mistral-24B</option>
      </select>
    </div>
    <div class="control-group">
      <label>Search narrative</label>
      <input type="text" id="searchText" placeholder="keyword..." style="width:140px">
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="legend">
    <span><span class="dot" style="background:var(--green)"></span> NTA (Not The Asshole)</span>
    <span><span class="dot" style="background:var(--red)"></span> YTA (You're The Asshole)</span>
    <span><span class="dot" style="background:var(--orange)"></span> Sycophantic flip (changes with framing)</span>
  </div>

  <div id="postList"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
const PAGE_SIZE = 20;
let allPosts = [];
let filtered = [];
let page = 0;
let activeCondition = {};

async function init() {
  document.getElementById('postList').innerHTML = `
    <div class="loading"><div class="spinner"></div>Loading 4,000 AITA posts...</div>`;
  const resp = await fetch('data.json');
  allPosts = await resp.json();
  bindControls();
  applyFilters();
}

function bindControls() {
  ['sortBy','filterReddit','minSyc','filterDisagree','searchText'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => { page = 0; applyFilters(); });
  });
}

function applyFilters() {
  const sort = document.getElementById('sortBy').value;
  const reddit = document.getElementById('filterReddit').value;
  const minSyc = parseFloat(document.getElementById('minSyc').value) || 0;
  const disagree = document.getElementById('filterDisagree').value;
  const search = document.getElementById('searchText').value.toLowerCase();

  filtered = allPosts.filter(p => {
    if (reddit !== 'all' && p.reddit !== reddit) return false;
    if (p.sycScore < minSyc) return false;
    if (search && !p.narrative.toLowerCase().includes(search)) return false;
    if (disagree !== 'any') {
      const mj = p.judgments[disagree];
      if (!mj || !mj.base || mj.base === p.reddit) return false;
    }
    return true;
  });

  if (sort === 'syc-desc') filtered.sort((a, b) => b.sycScore - a.sycScore);
  else if (sort === 'syc-asc') filtered.sort((a, b) => a.sycScore - b.sycScore);
  else filtered.sort((a, b) => a.id - b.id);

  renderStats();
  renderPage();
}

function renderStats() {
  const avgSyc = filtered.length ? (filtered.reduce((s, p) => s + p.sycScore, 0) / filtered.length).toFixed(1) : 0;
  const ytaCount = filtered.filter(p => p.reddit === 'YTA').length;
  document.getElementById('stats').innerHTML = `
    <span>Showing <span class="num">${filtered.length}</span> / ${allPosts.length} posts</span>
    <span>Avg sycophancy: <span class="num">${avgSyc}</span></span>
    <span>Reddit YTA: <span class="num">${ytaCount}</span> (${filtered.length ? Math.round(100*ytaCount/filtered.length) : 0}%)</span>
  `;
}

function renderPage() {
  const start = page * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);
  const list = document.getElementById('postList');

  if (!slice.length) {
    list.innerHTML = '<div class="loading">No posts match your filters.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  list.innerHTML = slice.map((p, idx) => {
    const globalIdx = start + idx;
    const titleText = p.narrative.split('\n')[0].substring(0, 120);
    return `
      <div class="post-card" id="post-${globalIdx}">
        <div class="post-header" onclick="togglePost(${globalIdx})">
          <div class="left">
            <div class="title">#${globalIdx + 1} &mdash; ${esc(titleText)}</div>
          </div>
          <div class="badges">
            <span class="badge badge-syc">syc: ${p.sycScore}</span>
            <span class="badge badge-${p.reddit.toLowerCase()}">Reddit: ${p.reddit}</span>
          </div>
        </div>
        <div class="post-body" id="body-${globalIdx}">
          <div class="section-label">AITA Post</div>
          <div class="narrative">${esc(p.narrative)}</div>

          <div class="section-label">Model Judgments (binary)</div>
          <div class="condition-tabs" id="tabs-${globalIdx}">
            ${renderTabs(globalIdx, p)}
          </div>
          <div class="judgment-grid" id="grid-${globalIdx}">
            ${renderGrid(p, 'base')}
          </div>

          ${Object.keys(p.sycDetails).length ? `
            <div class="section-label">Sycophantic Flips (NTA context vs YTA context)</div>
            <div class="syc-detail">
              ${Object.entries(p.sycDetails).map(([m, d]) => `<div><strong>${esc(m)}:</strong> ${esc(d)}</div>`).join('')}
            </div>
          ` : ''}

          ${Object.keys(p.responses).length ? `
            <div class="section-label">Sample AI Responses (base condition)</div>
            ${Object.entries(p.responses).map(([m, r]) => `
              <div class="response-block">
                <div class="model-tag">${esc(m)}</div>
                ${esc(r)}
              </div>
            `).join('')}
          ` : ''}
        </div>
      </div>`;
  }).join('');

  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  document.getElementById('pagination').innerHTML = `
    <button onclick="changePage(-1)" ${page === 0 ? 'disabled' : ''}>Prev</button>
    <span>Page ${page + 1} of ${totalPages}</span>
    <button onclick="changePage(1)" ${page >= totalPages - 1 ? 'disabled' : ''}>Next</button>
  `;
}

function renderTabs(idx, post) {
  const conditions = ['base','NTA_context','YTA_context','third_person','think_right','think_wrong',
    'honest','direct','cot','questioning','iterative_response'];
  const labels = {
    base:'Base', NTA_context:'NTA Context', YTA_context:'YTA Context',
    third_person:'3rd Person', think_right:'Think Right', think_wrong:'Think Wrong',
    honest:'Honest', direct:'Direct', cot:'CoT', questioning:'Questioning',
    iterative_response:'Iterative'
  };
  // Only show conditions that have data for this post
  const available = conditions.filter(c =>
    Object.values(post.judgments).some(mj => mj[c] != null)
  );
  activeCondition[idx] = activeCondition[idx] || 'base';
  return available.map(c =>
    `<span class="condition-tab ${activeCondition[idx] === c ? 'active' : ''}"
          onclick="switchCondition(${idx}, '${c}', event)">${labels[c] || c}</span>`
  ).join('');
}

function renderGrid(post, condition) {
  const models = Object.keys(post.judgments).sort();
  return models.map(m => {
    const v = post.judgments[m][condition];
    if (v == null) return '';
    const cls = v === 'NTA' ? 'verdict-nta' : 'verdict-yta';
    const disagrees = v !== post.reddit;
    const flipped = post.sycDetails[m] && (condition === 'NTA_context' || condition === 'YTA_context');
    return `<div class="judgment-cell ${flipped ? 'flipped' : ''} ${!disagrees ? 'agrees-reddit' : ''}">
      <span class="model-name">${esc(m)}</span>
      <span class="${cls}">${v}${disagrees ? ' *' : ''}</span>
    </div>`;
  }).filter(Boolean).join('');
}

function switchCondition(idx, cond, ev) {
  ev.stopPropagation();
  activeCondition[idx] = cond;
  const post = filtered[idx];
  document.getElementById(`tabs-${idx}`).innerHTML = renderTabs(idx, post);
  document.getElementById(`grid-${idx}`).innerHTML = renderGrid(post, cond);
}

function togglePost(idx) {
  document.getElementById(`body-${idx}`).classList.toggle('open');
}

function changePage(delta) {
  page += delta;
  renderPage();
  window.scrollTo(0, 0);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
